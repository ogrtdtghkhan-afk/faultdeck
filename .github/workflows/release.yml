name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish archives
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build and package
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0 or v0.2.0-rc.1"
            exit 1
          fi
          version="${TAG_NAME#v}"
          mkdir -p dist
          for platform in linux windows darwin; do
            for arch in amd64 arm64; do
              package="faultdeck_${version}_${platform}_${arch}"
              staging="dist/$package"
              mkdir -p "$staging"
              binary=faultdeck
              if [ "$platform" = windows ]; then
                binary=faultdeck.exe
              fi
              GOOS="$platform" GOARCH="$arch" go build \
                -trimpath -buildvcs=false \
                -ldflags "-s -w -X main.version=$version" \
                -o "$staging/$binary" ./cmd/faultdeck
              cp README.md README.zh-CN.md LICENSE SECURITY.md CONTRIBUTING.md "$staging/"
              cp -R examples docs "$staging/"
              if [ "$platform" = windows ]; then
                (cd dist && zip -qr "$package.zip" "$package")
              else
                tar -czf "dist/$package.tar.gz" -C dist "$package"
              fi
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            --verify-tag \
            --title "FaultDeck $TAG_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
